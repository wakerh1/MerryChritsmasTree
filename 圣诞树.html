<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D Gesture Christmas Tree - Creative Tech</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050a05; font-family: 'Segoe UI', sans-serif; }
        #container { width: 100vw; height: 100vh; }
        
        /* UI 叠加层 */
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #d4af37; /* 金属金 */
            z-index: 10;
            pointer-events: none;
        }
        .controls {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #d4af37;
        }
        input[type="file"] { display: none; }
        .btn {
            display: inline-block;
            padding: 8px 15px;
            background: #b22222; /* 圣诞红 */
            color: white;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn:hover { background: #ff4500; }

        /* 隐藏的视频源 */
        #video-input {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 240px;
            height: 180px;
            border: 2px solid #d4af37;
            border-radius: 8px;
            transform: scaleX(-1);
        }
        #status-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            border-radius: 20px;
            border: 1px solid #b22222;
        }
    </style>
</head>
<body>

<div id="ui-overlay">
    <h1>Merry Christmas 2025</h1>
    <div class="controls">
        <p>手势指南：<br>✊ 握拳：合拢 | 🖐️ 张手：散开<br>🤏 捏合：抓取照片 | ✋ 移动：旋转视角</p>
        <label class="btn" for="upload">上传照片云 (可多选)</label>
        <input type="file" id="upload" multiple accept="image/*">
    </div>
</div>

<div id="status-indicator">正在初始化摄像头...</div>
<video id="video-input"></video>
<div id="container"></div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { gsap } from 'https://cdn.skypack.dev/gsap';

/**
 * MediaPipe 环境加载 (通过 CDN 引入 UMD)
 */
const script_mp = document.createElement('script');
script_mp.src = "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js";
document.head.appendChild(script_mp);

// --- 全局变量 ---
let scene, camera, renderer, composer, controls;
let instancedSpheres, instancedCubes;
let photoMeshes = [];
let targetState = 'CLOSED'; // CLOSED, EXPLODED, FOCUS
const ELEMENT_COUNT = 400;
const photoGroup = new THREE.Group();

// 颜色定义
const COLORS = {
    gold: new THREE.Color(0xd4af37),
    red: new THREE.Color(0xb22222),
    green: new THREE.Color(0x1a3300)
};

// --- 初始化场景 ---
function initScene() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050a05, 0.02);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 15);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ReinhardToneMapping;
    document.getElementById('container').appendChild(renderer.domElement);

    // 辉光效果
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0.2;
    bloomPass.strength = 1.2;
    composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // 灯光
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xd4af37, 20);
    pointLight.position.set(5, 10, 5);
    scene.add(pointLight);

    createTreeElements();
    scene.add(photoGroup);

    window.addEventListener('resize', onWindowResize);
}

// --- 创建圣诞树元素 ---
function createTreeElements() {
    const sphereGeom = new THREE.SphereGeometry(0.1, 16, 16);
    const cubeGeom = new THREE.BoxGeometry(0.15, 0.15, 0.15);
    
    const goldMat = new THREE.MeshStandardMaterial({ 
        color: COLORS.gold, metalness: 0.9, roughness: 0.1 
    });
    const redMat = new THREE.MeshStandardMaterial({ 
        color: COLORS.red, metalness: 0.5, roughness: 0.5 
    });

    instancedSpheres = new THREE.InstancedMesh(sphereGeom, goldMat, ELEMENT_COUNT);
    instancedCubes = new THREE.InstancedMesh(cubeGeom, redMat, ELEMENT_COUNT);
    
    // 初始化位置数据
    setupPositions();
    
    scene.add(instancedSpheres, instancedCubes);
}

// 核心算法：计算树状坐标 vs 散开坐标
const positions = { tree: [], random: [] };

function setupPositions() {
    for (let i = 0; i < ELEMENT_COUNT * 2; i++) {
        // 1. 树状坐标 (圆锥体)
        const h = Math.random() * 10;
        const radius = (10 - h) * 0.4;
        const angle = Math.random() * Math.PI * 2;
        positions.tree.push(new THREE.Vector3(
            Math.cos(angle) * radius,
            h - 5,
            Math.sin(angle) * radius
        ));

        // 2. 随机坐标
        positions.random.push(new THREE.Vector3(
            (Math.random() - 0.5) * 20,
            (Math.random() - 0.5) * 20,
            (Math.random() - 0.5) * 20
        ));
    }
    updateInstances(0);
}

function updateInstances(lerpFactor) {
    const dummy = new THREE.Object3D();
    for (let i = 0; i < ELEMENT_COUNT; i++) {
        const targetPos = new THREE.Vector3().lerpVectors(positions.tree[i], positions.random[i], lerpFactor);
        dummy.position.copy(targetPos);
        dummy.updateMatrix();
        instancedSpheres.setMatrixAt(i, dummy.matrix);
        
        const targetPosCube = new THREE.Vector3().lerpVectors(positions.tree[i+ELEMENT_COUNT], positions.random[i+ELEMENT_COUNT], lerpFactor);
        dummy.position.copy(targetPosCube);
        dummy.updateMatrix();
        instancedCubes.setMatrixAt(i, dummy.matrix);
    }
    instancedSpheres.instanceMatrix.needsUpdate = true;
    instancedCubes.instanceMatrix.needsUpdate = true;
}

// --- 状态切换动画 ---
function transitionTo(state) {
    if (targetState === state) return;
    targetState = state;
    document.getElementById('status-indicator').innerText = `当前状态: ${state}`;

    const obj = { val: targetState === 'EXPLODED' ? 0 : 1 };
    gsap.to(obj, {
        val: targetState === 'EXPLODED' ? 1 : 0,
        duration: 1.5,
        ease: "power2.inOut",
        onUpdate: () => {
            updateInstances(obj.val);
            // 同时也移动照片
            photoMeshes.forEach((mesh, idx) => {
                const treePos = positions.tree[idx % ELEMENT_COUNT].clone().multiplyScalar(1.2);
                const randomPos = positions.random[idx % ELEMENT_COUNT];
                mesh.position.lerpVectors(treePos, randomPos, obj.val);
            });
        }
    });
}

// --- 处理照片上传 ---
document.getElementById('upload').addEventListener('change', (e) => {
    const files = e.target.files;
    const loader = new THREE.TextureLoader();
    
    Array.from(files).forEach((file, index) => {
        const url = URL.createObjectURL(file);
        loader.load(url, (texture) => {
            const aspect = texture.image.width / texture.image.height;
            const geom = new THREE.PlaneGeometry(1 * aspect, 1);
            const mat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geom, mat);
            
            // 初始位置在树上
            const p = positions.tree[index % ELEMENT_COUNT];
            mesh.position.copy(p);
            photoMeshes.push(mesh);
            photoGroup.add(mesh);
        });
    });
});

// --- MediaPipe 手势处理 ---
async function setupHands() {
    const videoElement = document.getElementById('video-input');
    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    hands.onResults(onHandResults);

    const cameraStream = new Camera(videoElement, {
        onFrame: async () => {
            await hands.send({ image: videoElement });
        },
        width: 640,
        height: 480
    });
    cameraStream.start();
}

function onHandResults(results) {
    if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;
    
    const landmarks = results.multiHandLandmarks[0];
    
    // 1. 判断 握拳 vs 张开
    // 计算指尖到掌心(地标0)的平均距离
    const tips = [8, 12, 16, 20];
    let avgDist = 0;
    tips.forEach(idx => {
        const d = Math.hypot(landmarks[idx].x - landmarks[0].x, landmarks[idx].y - landmarks[0].y);
        avgDist += d;
    });
    avgDist /= 4;

    if (avgDist < 0.15) {
        transitionTo('CLOSED');
    } else if (avgDist > 0.35) {
        transitionTo('EXPLODED');
    }

    // 2. 旋转逻辑 (利用手掌中心位移)
    if (targetState === 'EXPLODED') {
        const centerX = landmarks[9].x - 0.5; // 归一化到 -0.5, 0.5
        const centerY = landmarks[9].y - 0.5;
        gsap.to(camera.position, {
            x: centerX * 30,
            y: -centerY * 20 + 5,
            duration: 0.5
        });
        camera.lookAt(0, 0, 0);
    }

    // 3. 捏合/抓取 (食指8 和 拇指4)
    const pinchDist = Math.hypot(landmarks[8].x - landmarks[4].x, landmarks[8].y - landmarks[4].y);
    if (pinchDist < 0.05 && photoMeshes.length > 0) {
        // 进入照片放大态 (此处简化为放大第一张或随机一张)
        if (targetState !== 'FOCUS') {
            const randomPhoto = photoMeshes[Math.floor(Math.random() * photoMeshes.length)];
            zoomPhoto(randomPhoto);
        }
    }
}

function zoomPhoto(mesh) {
    targetState = 'FOCUS';
    gsap.to(mesh.scale, { x: 5, y: 5, z: 5, duration: 1 });
    gsap.to(mesh.position, { x: 0, y: 0, z: 5, duration: 1 });
    
    // 3秒后自动回到散开态
    setTimeout(() => {
        gsap.to(mesh.scale, { x: 1, y: 1, z: 1, duration: 1 });
        transitionTo('EXPLODED');
    }, 4000);
}

// --- 辅助循环与工具 ---
function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    requestAnimationFrame(animate);
    // 自动轻微旋转
    if (targetState === 'CLOSED') {
        scene.rotation.y += 0.005;
    }
    composer.render();
}

// 动态加载 MediaPipe Camera 工具
const script_cam = document.createElement('script');
script_cam.src = "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js";
script_cam.onload = () => {
    initScene();
    setupHands();
    animate();
};
document.head.appendChild(script_cam);

</script>
</body>
</html>
