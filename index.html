<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Golden Christmas 3D - Gesture Control</title>
    <style>
        body { margin: 0; overflow: hidden; background: #020502; font-family: 'PingFang SC', sans-serif; }
        #container { width: 100vw; height: 100vh; }
        
        #ui-overlay {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #ffdf00;
            z-index: 10;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            pointer-events: none;
        }

        .controls {
            pointer-events: auto;
            background: rgba(0, 20, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #d4af37;
            backdrop-filter: blur(10px);
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(135deg, #b22222, #ff0000);
            color: white;
            cursor: pointer;
            border-radius: 25px;
            margin-top: 15px;
            border: 1px solid #ffdf00;
            box-shadow: 0 4px 15px rgba(178, 34, 34, 0.4);
            transition: 0.3s;
        }

        #video-input {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            border: 2px solid #d4af37;
            border-radius: 10px;
            transform: scaleX(-1);
            background: #000;
        }

        #status {
            position: absolute;
            bottom: 180px;
            right: 20px;
            color: #d4af37;
            font-size: 14px;
            text-align: right;
        }
    </style>
</head>
<body>

<div id="ui-overlay">
    <h1 style="margin:0; font-size: 2.5em;">璀璨圣诞 · 手势交互</h1>
    <p style="color: #ffffff; opacity: 0.8;">Premium 3D Experience</p>
    <div class="controls">

        <label class="btn" for="upload">上传您的回忆照片</label>
        <input type="file" id="upload" multiple accept="image/*" style="display:none">
    </div>
</div>

<div id="status">系统初始化中...</div>
<video id="video-input" playsinline></video>
<div id="container"></div>

// --- 2. 核心：金碧辉煌灯光系统 ---
function setupLights() {
    // 全局暖色环境光
    const ambient = new THREE.AmbientLight(0xffdf00, 0.5);
    scene.add(ambient);

    // 主金色光源 (模拟舞台灯光)
    const mainLight = new THREE.DirectionalLight(0xfffaf0, 3);
    mainLight.position.set(5, 10, 7);
    scene.add(mainLight);

    // 辅助红色补光 (增加立体感)
    const fillLight = new THREE.PointLight(0xff0000, 15);
    fillLight.position.set(-5, 2, 2);
    scene.add(fillLight);

    // 底部金色反光
    const bottomLight = new THREE.RectAreaLight(0xd4af37, 5, 10, 10);
    bottomLight.position.set(0, -5, 0);
    bottomLight.lookAt(0, 0, 0);
    scene.add(bottomLight);
}

// --- 3. 核心：创建环境反射 (让金属闪耀的关键) ---
function createProceduralEnvMap() {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
    grad.addColorStop(0, '#ffffff'); // 中心高光
    grad.addColorStop(0.2, '#ffd700'); // 金色
    grad.addColorStop(1, '#1a3300'); // 深绿背景
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 256, 256);
    
    const envTexture = new THREE.CanvasTexture(canvas);
    envTexture.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = envTexture;
}
