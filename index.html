<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Magic | Creative Tech Demo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Times+New+Roman&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-bg: #000000;
            --color-gold: #d4af37;
            --color-cream: #fceea7;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--color-bg);
            font-family: 'Times New Roman', serif;
            user-select: none;
        }

        /* UI Layer */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Header */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 56px;
            text-align: center;
            margin-top: 40px;
            background: linear-gradient(to bottom, #ffffff 0%, var(--color-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.5));
            letter-spacing: 4px;
        }

        /* Upload Controls */
        .upload-wrapper {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: auto;
        }

        .btn-upload {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid var(--color-gold);
            color: var(--color-cream);
            padding: 12px 30px;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-upload:hover {
            background: rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .hint-text {
            display: block;
            margin-top: 15px;
            color: rgba(252, 238, 167, 0.6);
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* Loading Screen */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(212, 175, 55, 0.1);
            border-top: 2px solid var(--color-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: var(--color-gold);
            font-family: 'Cinzel', serif;
            letter-spacing: 3px;
            font-size: 14px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* CV Container (Hidden but active) */
        #cv-container {
            position: absolute;
            bottom: 0;
            right: 0;
            opacity: 0; /* Hidden as per specs */
            pointer-events: none;
        }
        
        /* Debug info for gestures (Optional/Dev) */
        #gesture-debug {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--color-gold);
            font-family: monospace;
            font-size: 12px;
            text-align: right;
            opacity: 0.7;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
        }
    }
    </script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div class="loading-text">LOADING HOLIDAY MAGIC</div>
    </div>

    <div id="ui-container">
        <h1>Merry Christmas</h1>
        <div id="gesture-debug">CV INITIALIZING...</div>
        
        <div class="upload-wrapper">
            <button class="btn-upload" onclick="document.getElementById('file-input').click()">ADD MEMORIES</button>
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            <span class="hint-text">Press 'H' to Hide Controls<br>Gestures: Open (Scatter) | Fist (Tree) | Pinch (Focus)</span>
        </div>
    </div>

    <div id="cv-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="cv-canvas" width="160" height="120"></canvas>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // --- Configuration ---
        const CONFIG = {
            colors: { gold: 0xd4af37, cream: 0xfceea7, green: 0x0f3b1e, red: 0x8a0303, orange: 0xffaa00, blue: 0x0044ff },
            particleCount: 1500,
            dustCount: 2500,
            camPos: new THREE.Vector3(0, 2, 50),
            bloom: { strength: 0.45, radius: 0.4, threshold: 0.7 }
        };

        // --- State Machine ---
        const MODES = { TREE: 'TREE', SCATTER: 'SCATTER', FOCUS: 'FOCUS' };
        
        const STATE = {
            mode: MODES.TREE,
            gesture: 'None',
            targetRotation: { x: 0, y: 0 },
            activePhotoIndex: -1,
            time: 0
        };

        class Particle {
            constructor(mesh, type) {
                this.mesh = mesh;
                this.type = type; // 'ORNAMENT', 'CANDY', 'PHOTO', 'DUST'
                this.baseScale = mesh.scale.x;
                this.randomOffset = Math.random() * Math.PI * 2;
                this.speed = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.05,
                    (Math.random() - 0.5) * 0.05,
                    (Math.random() - 0.5) * 0.05
                );
                
                // Target properties for lerping
                this.targetPos = new THREE.Vector3();
                this.targetRot = new THREE.Euler();
                this.targetScale = this.baseScale;
            }
        }

        class App {
            constructor() {
                this.container = document.body;
                this.particles = [];
                this.photos = [];
                this.dummy = new THREE.Object3D();
                this.clock = new THREE.Clock();
                
                this.initThree();
                this.initPostProcessing();
                this.initContent();
                this.initInputs();
                
                // Start Vision async, don't block render loop start
                this.initVision().then(() => {
                    const loader = document.getElementById('loader');
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 1000);
                });

                this.animate = this.animate.bind(this);
                requestAnimationFrame(this.animate);
            }

            initThree() {
                // Renderer
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.toneMapping = THREE.ReinhardToneMapping;
                this.renderer.toneMappingExposure = 2.2;
                this.container.appendChild(this.renderer.domElement);

                // Scene & Camera
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.copy(CONFIG.camPos);

                // Environment
                const pmremGenerator = new THREE.PMREMGenerator(this.renderer);
                this.scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

                // Lights
                const ambient = new THREE.AmbientLight(0xffffff, 0.6);
                const point = new THREE.PointLight(CONFIG.colors.orange, 2, 20); // Internal glow
                const spotGold = new THREE.SpotLight(CONFIG.colors.gold, 1200);
                spotGold.position.set(30, 40, 40);
                spotGold.angle = Math.PI / 6;
                const spotBlue = new THREE.SpotLight(CONFIG.colors.blue, 600); // Cool rim light
                spotBlue.position.set(-30, 20, -30);

                this.scene.add(ambient, point, spotGold, spotBlue);

                // Groups
                this.mainGroup = new THREE.Group();
                this.scene.add(this.mainGroup);
            }

            initPostProcessing() {
                this.composer = new EffectComposer(this.renderer);
                
                const renderPass = new RenderPass(this.scene, this.camera);
                this.composer.addPass(renderPass);

                const bloomPass = new UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    CONFIG.bloom.strength,
                    CONFIG.bloom.radius,
                    CONFIG.bloom.threshold
                );
                this.composer.addPass(bloomPass);
            }

            // --- Procedural Content Generation ---

            createCandyCaneTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 64; canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0,0,64,64);
                ctx.fillStyle = '#ff0000';
                
                // Draw stripes
                for(let i=-64; i<64; i+=16) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i+8, 0);
                    ctx.lineTo(i+8+64, 64);
                    ctx.lineTo(i+64, 64);
                    ctx.fill();
                }
                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                return tex;
            }

            createPhotoFrame(texture) {
                const group = new THREE.Group();
                
                // Gold Frame
                const frameGeo = new THREE.BoxGeometry(4.2, 3.2, 0.2);
                const frameMat = new THREE.MeshStandardMaterial({ 
                    color: CONFIG.colors.gold, 
                    roughness: 0.2, 
                    metalness: 1.0 
                });
                const frame = new THREE.Mesh(frameGeo, frameMat);
                
                // Photo
                const photoGeo = new THREE.PlaneGeometry(3.8, 2.8);
                const photoMat = new THREE.MeshBasicMaterial({ map: texture });
                const photo = new THREE.Mesh(photoGeo, photoMat);
                photo.position.z = 0.11;

                group.add(frame, photo);
                return group;
            }

            createDefaultPhoto() {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 384;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fceea7';
                ctx.fillRect(0,0,512,384);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 60px "Cinzel"';
                ctx.textAlign = 'center';
                ctx.fillText("Merry", 256, 160);
                ctx.fillText("Christmas", 256, 240);
                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }

            initContent() {
                // Materials
                const matGold = new THREE.MeshStandardMaterial({ color: CONFIG.colors.gold, roughness: 0.3, metalness: 0.8 });
                const matGreen = new THREE.MeshStandardMaterial({ color: CONFIG.colors.green, roughness: 0.8 });
                const matRed = new THREE.MeshPhysicalMaterial({ color: CONFIG.colors.red, roughness: 0.2, clearcoat: 1.0 });
                const matCandy = new THREE.MeshStandardMaterial({ map: this.createCandyCaneTexture(), roughness: 0.4 });

                // Geometries
                const geoBox = new THREE.BoxGeometry(1, 1, 1);
                const geoSphere = new THREE.SphereGeometry(0.6, 16, 16);
                
                // Candy Cane Geometry
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(0, 2, 0),
                    new THREE.Vector3(0.5, 2.5, 0),
                    new THREE.Vector3(1, 2, 0)
                ]);
                const geoCane = new THREE.TubeGeometry(curve, 20, 0.15, 8, false);

                // 1. Add Default Photo
                const defaultPhotoTex = this.createDefaultPhoto();
                this.addPhotoToScene(defaultPhotoTex);

                // 2. Generate Ornaments
                for (let i = 0; i < CONFIG.particleCount; i++) {
                    let mesh;
                    let type = 'ORNAMENT';
                    const rand = Math.random();

                    if (rand > 0.95) {
                        // Candy Cane
                        mesh = new THREE.Mesh(geoCane, matCandy);
                        type = 'CANDY';
                        mesh.scale.set(0.5, 0.5, 0.5);
                    } else if (rand > 0.7) {
                        // Sphere (Red/Gold)
                        mesh = new THREE.Mesh(geoSphere, Math.random() > 0.5 ? matRed : matGold);
                    } else {
                        // Box (Green/Gold)
                        mesh = new THREE.Mesh(geoBox, Math.random() > 0.7 ? matGold : matGreen);
                        mesh.scale.setScalar(Math.random() * 0.5 + 0.3);
                    }

                    this.mainGroup.add(mesh);
                    this.particles.push(new Particle(mesh, type));
                }

                // 3. Generate Dust
                const dustGeo = new THREE.BufferGeometry();
                const dustPos = [];
                for(let i=0; i<CONFIG.dustCount; i++) {
                    const r = 25 * Math.sqrt(Math.random());
                    const theta = Math.random() * 2 * Math.PI;
                    const phi = Math.acos(2 * Math.random() - 1);
                    dustPos.push(r * Math.sin(phi) * Math.cos(theta));
                    dustPos.push(r * Math.sin(phi) * Math.sin(theta));
                    dustPos.push(r * Math.cos(phi));
                }
                dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dustPos, 3));
                const dustMat = new THREE.PointsMaterial({ 
                    color: CONFIG.colors.gold, 
                    size: 0.1, 
                    transparent: true, 
                    opacity: 0.6, 
                    blending: THREE.AdditiveBlending 
                });
                this.dustSystem = new THREE.Points(dustGeo, dustMat);
                this.scene.add(this.dustSystem);
            }

            addPhotoToScene(texture) {
                const mesh = this.createPhotoFrame(texture);
                this.mainGroup.add(mesh);
                const p = new Particle(mesh, 'PHOTO');
                p.baseScale = 1;
                this.particles.push(p);
                this.photos.push(p); // Track photos separately for logic
            }

            initInputs() {
                // File Upload
                const input = document.getElementById('file-input');
                const reader = new FileReader();

                reader.onload = (ev) => {
                    new THREE.TextureLoader().load(ev.target.result, (t) => {
                        t.colorSpace = THREE.SRGBColorSpace;
                        this.addPhotoToScene(t);
                    });
                };

                input.addEventListener('change', (e) => {
                    if(e.target.files && e.target.files[0]) {
                        reader.readAsDataURL(e.target.files[0]);
                    }
                });

                // Window Resize
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                    this.composer.setSize(window.innerWidth, window.innerHeight);
                });

                // Keyboard 'H'
                window.addEventListener('keydown', (e) => {
                    if (e.key.toLowerCase() === 'h') {
                        document.getElementById('ui-container').classList.toggle('ui-hidden');
                    }
                });
            }

            // --- Computer Vision ---
            
            async initVision() {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                this.handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 1
                });

                // Setup Webcam
                const video = document.getElementById('webcam');
                const constraints = { video: true };
                
                try {
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream;
                    video.addEventListener('loadeddata', () => {
                        this.visionEnabled = true;
                    });
                } catch (err) {
                    console.warn("Webcam access denied", err);
                }
            }

            processGestures(landmarks) {
                if (!landmarks || landmarks.length === 0) return;

                const lm = landmarks[0]; // First hand
                const thumb = lm[4];
                const index = lm[8];
                const wrist = lm[0];
                const tips = [lm[8], lm[12], lm[16], lm[20]]; // Index, Middle, Ring, Pinky

                // 1. Interaction Mapping (Palm center ~ index 9)
                const palm = lm[9];
                // Map 0..1 to rotation range. Invert X for mirror feel.
                STATE.targetRotation.y = (palm.x - 0.5) * 2.0; // -1 to 1 range
                STATE.targetRotation.x = (palm.y - 0.5) * 1.0;

                // 2. Gesture Detection Logic
                
                // Pinch: Thumb tip to Index tip distance
                const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y, thumb.z - index.z);
                
                // Average distance from tips to wrist (for Fist/Open)
                let avgTipDist = 0;
                tips.forEach(t => {
                    avgTipDist += Math.hypot(t.x - wrist.x, t.y - wrist.y, t.z - wrist.z);
                });
                avgTipDist /= 4;

                let detected = 'None';
                
                if (pinchDist < 0.05) {
                    detected = 'PINCH';
                    if(STATE.mode !== MODES.FOCUS) {
                        STATE.mode = MODES.FOCUS;
                        // Select random photo
                        if(this.photos.length > 0) {
                            STATE.activePhotoIndex = Math.floor(Math.random() * this.photos.length);
                        }
                    }
                } else if (avgTipDist < 0.25) {
                    detected = 'FIST';
                    if(STATE.mode !== MODES.TREE) STATE.mode = MODES.TREE;
                } else if (avgTipDist > 0.4) {
                    detected = 'OPEN';
                    if(STATE.mode !== MODES.SCATTER) STATE.mode = MODES.SCATTER;
                }

                STATE.gesture = detected;
                document.getElementById('gesture-debug').innerText = `GESTURE: ${detected} | MODE: ${STATE.mode}`;
            }

            // --- Animation Logic ---

            updateParticles(time, delta) {
                // Smoothly interpolate group rotation based on hand input
                this.mainGroup.rotation.y = THREE.MathUtils.lerp(this.mainGroup.rotation.y, STATE.targetRotation.y, 0.1);
                this.mainGroup.rotation.x = THREE.MathUtils.lerp(this.mainGroup.rotation.x, STATE.targetRotation.x, 0.1);

                // Auto rotate if no hand interaction
                if(!this.visionEnabled || STATE.gesture === 'None') {
                    this.mainGroup.rotation.y += delta * 0.1;
                }

                // Calculate positions based on Mode
                const total = this.particles.length;
                
                this.particles.forEach((p, i) => {
                    const t = i / total;
                    
                    if (STATE.mode === MODES.TREE) {
                        // Spiral Cone Formula
                        const angle = t * 50 * Math.PI + p.randomOffset;
                        const height = (t * 20) - 10; // -10 to 10
                        const radius = (1 - t) * 8; 
                        
                        p.targetPos.set(
                            Math.cos(angle) * radius,
                            height,
                            Math.sin(angle) * radius
                        );
                        p.targetScale = p.baseScale;
                        // Face outwards
                        p.targetRot.set(0, -angle, 0);

                    } else if (STATE.mode === MODES.SCATTER) {
                        // Random Sphere Distribution
                        // We use a deterministic random via offset to keep them stable in scatter mode
                        const r = 8 + (Math.sin(i + time) * 0.5 + 0.5) * 12; // 8 to 20
                        const theta = (i * 137.5) * (Math.PI / 180);
                        const phi = Math.acos(2 * (i/total) - 1);
                        
                        p.targetPos.set(
                            r * Math.sin(phi) * Math.cos(theta),
                            r * Math.sin(phi) * Math.sin(theta),
                            r * Math.cos(phi)
                        );
                        
                        // Rotate based on random speed
                        p.mesh.rotation.x += p.speed.x;
                        p.mesh.rotation.y += p.speed.y;
                        p.targetScale = p.baseScale;

                    } else if (STATE.mode === MODES.FOCUS) {
                        // Focus Logic
                        const isTarget = (p.type === 'PHOTO' && this.photos.indexOf(p) === STATE.activePhotoIndex);
                        
                        if(isTarget) {
                            p.targetPos.set(0, 0, 30); // Move close to camera
                            p.targetScale = 4.5;
                            p.targetRot.set(0, 0, 0);
                            // Counter-rotate the group to keep photo facing camera
                            p.mesh.lookAt(this.camera.position); 
                        } else {
                            // Background particles scatter further away
                            const r = 35 + (i%10);
                            const theta = i * 0.5;
                            p.targetPos.set(Math.cos(theta)*r, (i%20)-10, Math.sin(theta)*r);
                            p.targetScale = p.baseScale * 0.5;
                        }
                    }

                    // Apply Lerp
                    const lerpSpeed = 0.05;
                    p.mesh.position.lerp(p.targetPos, lerpSpeed);
                    
                    if (STATE.mode !== MODES.SCATTER) {
                        // In scatter, we rotate manually. In others, we lerp to targetRot.
                        // Quaternion slerp would be better but Euler lerp is sufficient for this demo
                        p.mesh.rotation.x = THREE.MathUtils.lerp(p.mesh.rotation.x, p.targetRot.x, lerpSpeed);
                        p.mesh.rotation.y = THREE.MathUtils.lerp(p.mesh.rotation.y, p.targetRot.y, lerpSpeed);
                        p.mesh.rotation.z = THREE.MathUtils.lerp(p.mesh.rotation.z, p.targetRot.z, lerpSpeed);
                    }

                    p.mesh.scale.setScalar(THREE.MathUtils.lerp(p.mesh.scale.x, p.targetScale, lerpSpeed));
                });
            }

            animate() {
                const delta = this.clock.getDelta();
                STATE.time += delta;

                // CV Update
                if (this.visionEnabled && this.handLandmarker) {
                    const video = document.getElementById('webcam');
                    if(video.currentTime !== this.lastVideoTime) {
                        this.lastVideoTime = video.currentTime;
                        const results = this.handLandmarker.detectForVideo(video, performance.now());
                        this.processGestures(results.landmarks);
                    }
                }

                // Three.js Update
                this.updateParticles(STATE.time, delta);
                
                // Dust gentle rotation
                this.dustSystem.rotation.y += delta * 0.02;

                this.composer.render();
                requestAnimationFrame(this.animate);
            }
        }

        // Initialize Application
        window.addEventListener('DOMContentLoaded', () => {
            new App();
        });
    </script>
</body>
</html>
